# Apple Design Language — Release
# Created by Edison Augustin X.
#
# Publishes the GitHub release for the version in .claude-plugin/plugin.json, with that version's
# CHANGELOG.md section as the notes, after the same checks as CI pass. Two ways to start it:
#
#   Manual (no local git needed): Actions › Release › Run workflow, on main. The workflow creates the
#   tag v<version> at the tip of main, then publishes. Optionally type the version to confirm it.
#
#   Tag push: git tag -a v1.2.3 -m "v1.2.3" origin/main && git push origin v1.2.3
#
# Either way, bump the version in plugin.json and add its CHANGELOG.md section first, and merge to main.
# If the release already exists (for example, created on github.com), its title and notes are updated
# from CHANGELOG.md instead of failing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 — must equal plugin.json. Leave empty to use plugin.json."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EVENT: ${{ github.event_name }}
      REQUESTED: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run always releases main; a tag push releases the tagged commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve the version and commit
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            requested="${REQUESTED#v}"
            if [ -n "$requested" ] && [ "$requested" != "$version" ]; then
              echo "::error::You asked to release $requested, but plugin.json on main says $version. Bump plugin.json first."
              exit 1
            fi
            tag="v$version"
            sha="$(git rev-parse HEAD)"
            existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [ -n "$existing" ] && [ "$existing" != "$sha" ]; then
              echo "::error::$tag already exists at $existing, not at the tip of main ($sha). Bump the version in plugin.json and CHANGELOG.md."
              exit 1
            fi
            echo "CREATE_TAG=$([ -z "$existing" ] && echo true || echo false)" >> "$GITHUB_ENV"
          else
            tag="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match plugin.json version $version (expected v$version)."
              exit 1
            fi
            echo "CREATE_TAG=false" >> "$GITHUB_ENV"
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$tag points at $sha, which is not on main. Release a commit on main."
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "Releasing $tag at $sha"

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os, re, sys
          version = os.environ["TAG"][1:]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          if not match or not match.group(1).strip():
              sys.exit(f"::error::CHANGELOG.md has no section for [{version}]. Add one before releasing.")
          open(os.path.join(os.environ["RUNNER_TEMP"], "release-notes.md"), "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          EOF
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Rules and tokens are valid and up to date
        run: |
          python3 rules/tools/build_rules.py --check
          python3 skills/apple-design-language/scripts/build_tokens.py --check

      - name: Hook tests
        run: python3 -m unittest discover -s hooks/tests

      - name: Create the tag (manual runs)
        if: env.CREATE_TAG == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"   # pushed with GITHUB_TOKEN, so it doesn't start a second run

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Apple Design Language $TAG"
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its title and notes from CHANGELOG.md."
            gh release edit "$TAG" --title "$title" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file "$notes"
          fi
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
