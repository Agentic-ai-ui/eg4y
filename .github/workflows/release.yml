# Apple Design Language — Release
# Created by Edison Augustin X.
#
# Pushing a tag v<version> publishes the GitHub release for that version:
#   1. the tag must match `version` in .claude-plugin/plugin.json and point at a commit on main
#   2. the same checks as CI must pass on the tagged commit
#   3. the release notes are that version's section of CHANGELOG.md
#
# To release: bump the version in plugin.json, add its CHANGELOG.md section, merge to main, then
#   git tag -a v1.2.3 -m "v1.2.3" origin/main && git push origin v1.2.3

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches the plugin version and is on main
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match plugin.json version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os, re, sys
          version = os.environ["TAG"][1:]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          if not match or not match.group(1).strip():
              sys.exit(f"::error::CHANGELOG.md has no section for [{version}]. Add one before tagging.")
          open("release-notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          EOF
          cat release-notes.md

      - name: Rules and tokens are valid and up to date
        run: |
          python3 rules/tools/build_rules.py --check
          python3 skills/apple-design-language/scripts/build_tokens.py --check

      - name: Hook tests
        run: python3 -m unittest discover -s hooks/tests

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "Apple Design Language $TAG" --notes-file release-notes.md
