# Apple Design Language — CI
# Created by Edison Augustin X.
#
# Runs the same checks a contributor runs locally (see AGENTS.md › Commands):
#   1. generated files are valid and up to date (rules.json + rules index, tokens.css + design-tokens.md)
#   2. hook test suite on every supported Python (3.9 is what macOS ships with Xcode's tools)
#   3. plugin and marketplace manifests pass Claude Code's strict validator
#   4. web and React Native recipes (tests/web) type-check, build, and pass the Chromium + axe-core harness
#
# Runners are pinned to ubuntu-24.04: actions/python-versions has no Python 3.9 build for Ubuntu 26.04.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    name: Rules, tokens, and recipe docs are valid and up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate rules (rules.json and index up to date)
        run: python3 rules/tools/build_rules.py --check
      - name: Validate design tokens (tokens.css and design-tokens.md up to date)
        run: python3 skills/apple-design-language/scripts/build_tokens.py --check
      - name: Recipe code in the references matches tests/web
        run: python3 tests/web/sync_docs.py --check
      - name: Recipe sources pass the design rule checker
        run: python3 hooks/scripts/hig_lint.py tests/web

  hook-tests:
    name: Hook tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Detector coverage for every hook rule
        run: python3 hooks/scripts/hig_lint.py --list-rules
      - name: Run tests
        run: python3 -m unittest discover -s hooks/tests -v

  plugin:
    name: Plugin and marketplace manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: "2.1.283"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace (strict)
        run: claude plugin validate . --strict
      - name: Validate plugin manifest (strict)
        run: claude plugin validate .claude-plugin/plugin.json --strict

  web-recipes:
    name: Web and React Native recipes (type-check, build, Chromium + axe-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SHOTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Type-check React, Tailwind, React Native, Vue, and Svelte
        run: npm run typecheck
      - name: Build the browser recipes
        run: npm run build
      - name: Build Next.js and check its prerendered metadata
        run: npm run build:next
      - name: Verify in Chromium (layout, targets, tokens, dialogs, keyboard, axe-core)
        run: npm run verify
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recipe-screenshots
          path: tests/web/shots/
          if-no-files-found: ignore
